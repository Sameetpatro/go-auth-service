services:
  postgres:
    image: postgres:16-alpine
    container_name: event-entry-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_entry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.up.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-entry-api
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      ENVIRONMENT: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: event_entry
      DB_SSLMODE: disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-32-chars!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-chars!}
      EVENT_NAME: ${EVENT_NAME:-Annual Gala 2026}
      EVENT_DATE: ${EVENT_DATE:-2026-06-15}
      EVENT_LOCATION: ${EVENT_LOCATION:-Grand Convention Center}
      QR_IMAGE_PATH: /app/storage/qr
      QR_IMAGE_URL: http://localhost:8080/storage/qr
    volumes:
      - qr_storage:/app/storage/qr
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  qr_storage:
