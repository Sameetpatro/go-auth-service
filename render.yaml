# Render Blueprint — deploy with: render blueprint apply
# Docs: https://render.com/docs/blueprint-spec
#
# Database is hosted on Neon (https://neon.tech), not Render.
# Set DATABASE_URL in the Render dashboard to your Neon POOLED connection
# string (Connection Details → check "Pooled connection").

services:
  - type: web
    name: go-qr-auth
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SERVER_BASE_URL
        sync: false
      - key: QR_IMAGE_PATH
        value: /tmp/storage/qr
      - key: QR_IMAGE_URL
        sync: false
      - key: AUTO_MIGRATE
        value: "true"
      - key: EVENT_NAME
        value: FELICITATIONS & VEER GOKULA MANCHAN
      - key: EVENT_DATE
        value: "19 July 2026 | 1:00 PM"
      - key: EVENT_LOCATION
        value: Bharat Mandapam, New Delhi
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
