# Render Blueprint — deploy with: render blueprint apply
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: event-entry-db
    plan: free
    databaseName: event_entry
    user: event_entry_user

services:
  - type: web
    name: go-qr-auth
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: event-entry-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SERVER_BASE_URL
        sync: false
      - key: QR_IMAGE_PATH
        value: /tmp/storage/qr
      - key: QR_IMAGE_URL
        sync: false
      - key: AUTO_MIGRATE
        value: "true"
      - key: EVENT_NAME
        value: Annual Gala 2026
      - key: EVENT_DATE
        value: "2026-06-15"
      - key: EVENT_LOCATION
        value: Grand Convention Center
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
